# rig_nodes as a pixi source package: `pixi build --path src/rig_nodes/pixi.toml` makes the conda
# package CI publishes to the channel (.github/workflows/package-set.yml); the workspace manifest
# at the repository root depends on it by path, so `pixi install` there builds it in place.
# Pure Python (hatchling wheel via the pixi-build-python backend); the ROS 2 dependencies are
# conda packages, declared below, never pip.
#
# The RoboStack set (2026-11-18, docs/ros-distro-switch.md: Lyrical only) comes from the workspace:
# `ros2-distro-mutex = "*"` and `python = "*"` in host are replaced by `[workspace.build-variants]`
# (`0.22.* lyrical_30`, Python 3.14). The package is noarch and pixi-build-python carries no
# run_exports, so its run dependencies name the mutex bare and take the set from the consumer's own
# mutex pin through the distro-neutral `ros2-*` names; `ros2-rosbag2-py >=0.33` keeps it off a Jazzy
# set (the recorder passes rosbag2_py's stamps by keyword, which Jazzy's binding does not name).
# The backend is pinned to an exact nightly (backends are not in pixi.lock); bump it together with
# pixi-build-ros in src/rig_interfaces/pixi.toml.
[package]
name = "rig_nodes"
version = "0.5.0"

[package.build]
backend = { name = "pixi-build-python", version = "==0.8.8.20261117.1659.e14419f", channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"] }

[package.host-dependencies]
python = "*"
hatchling = "*"
ros2-distro-mutex = "*"

[package.run-dependencies]
python = ">=3.12"
# rclpy + std_msgs for the nodes; rosbag2_py + the MCAP storage plugin for the recorder;
# rosidl_runtime_py for graph_dump's type lookup. Spelled with RoboStack's distro-NEUTRAL names:
# `ros-<distro>-rclpy` is a 2 KiB shim that depends on `ros2-rclpy ==<that distro's version>` plus
# the set's mutex (checked in robostack-lyrical 2026-11-18), so the consumer's mutex pin decides
# which versions resolve. Should
# RoboStack rename them, this list is the only place.
ros2-rclpy = "*"
ros2-std-msgs = "*"
ros2-rosbag2-py = ">=0.33"
ros2-rosbag2-storage-mcap = "*"
ros2-rosidl-runtime-py = "*"
ros2-distro-mutex = "*"
mcap = ">=1.2"
websockets = ">=12"
# 0.3.0: the host monitor (rig_nodes.host_sampler: CPU, memory, disks, network, processes; NVML through ctypes)
psutil = "*"
# the backlight controller (rig_nodes.backlight: the serial driver)
pyserial = "*"
