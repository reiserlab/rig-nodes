# rig_interfaces as a pixi source package. The workspace manifest at the repository root depends
# on it by path (`rig_interfaces = { path = "src/rig_interfaces" }`), so `pixi install` builds it
# with the RoboStack pixi-build-ros backend — a conda package made from this package.xml /
# CMakeLists.txt, with no colcon step and nothing to source. CI builds the same package on
# win-64 / osx-arm64 / linux-64 and publishes it to the channel (.github/workflows/package-set.yml),
# so a rig installs it as a download (docs/typed-distribution-decision.md).
#
# The RoboStack set (2026-11-18, docs/ros-distro-switch.md: Lyrical only). pixi-build-ros takes the
# distro from the workspace's `robostack-lyrical` channel and maps package.xml's ament_cmake /
# rosidl_default_generators (host) and rosidl_default_runtime (run) to that distro's packages itself;
# it also adds `python` and the `ros2-distro-mutex` to host and run. Three pins tie the build to ONE
# set (the 0.2.0 build let each CI runner drift: mutex 0.20 + Python 3.14 on win-64/linux-64, 0.16 +
# 3.12 on osx-arm64):
# - the mutex BUILD, in the build- and host-dependencies below. It has to be spelled here: from the
#   nightly 0.7.7.20261117.1613 on, the backend writes `ros2-distro-mutex * lyrical_*` itself, which
#   is not a bare `*`, so the workspace's `[workspace.build-variants]` mutex value no longer replaces
#   it (up to 0.7.7.20261117.1120 it wrote a bare name and the variant applied);
# - Python 3.14, from the workspace's `python` build variant (the backend's `python` is still bare;
#   robostack-lyrical carries 3.12 and 3.14 builds of the set);
# - the backend itself, pinned to an exact nightly: backends are not in pixi.lock, and `version = "*"`
#   is how the change above reached CI unannounced. Bump deliberately, with the CI inspect step green.
# The RoboStack packages' run_exports carry the set into this package's run dependencies
# (`ros2-distro-mutex >=0.22.0,<0.23.0a0`, `python_abi 3.14.* *_cp314`; CI's inspect step checks both).
[package]
name = "rig_interfaces"
version = "0.5.0"

[package.build]
backend = { name = "pixi-build-ros", version = "==0.7.7.20261117.1659.e14419f", channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"] }

[package.build-dependencies]
ros2-distro-mutex = { version = "0.22.*", build = "lyrical_30" }

[package.host-dependencies]
ros2-distro-mutex = { version = "0.22.*", build = "lyrical_30" }
