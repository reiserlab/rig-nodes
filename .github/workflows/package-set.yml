# Build the rig-nodes package set — rig_interfaces (ament_cmake messages, pixi-build-ros) and
# rig_nodes (pure Python, pixi-build-python) — ONCE per platform, lay the result out as a conda
# channel, check the pins, and prove the channel installs and works in a clean directory on every
# platform (the release gate of rig-software-repos-and-runners.md §7.6). Ported from
# webDisplayTools' rig-interfaces.yml (2026-10-26).
#
# Runs: every pull request and every push to main (build + channel + acceptance); tags `v*`
# additionally upload to the hosted prefix.dev channel when the repository variable
# RIG_NODES_CHANNEL names one (with the PREFIX_API_KEY secret). Until the lab owns a hosted
# channel, the `rig-nodes-channel` artifact is committed into channel/ by hand on the release
# commit (README "Releasing a package set").
#
# The ROS distribution is one switch (docs/ros-distro-switch.md, 2026-11-05): the release path
# (build → channel → accept) runs on the set the rigs run, `jazzy` (RoboStack mutex 0.19, Python
# 3.12), spelled ONCE in each job's matrix; the `lyrical` job is the allowed-to-fail rehearsal of
# the next distribution.
name: package-set

on:
    pull_request:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: package-set-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    # The pixi + pixi-build backend pair the packages were last built and tested with. Bump
    # deliberately: the backends are NOT in pixi.lock. 0.83 since 2026-11-05: the rigs' floor
    # (SETUP.md) and the pixi that writes this repository's lock, which the `lyrical` job installs.
    PIXI_VERSION: v0.83.0
    PACKAGE_SET_VERSION: 0.4.0

jobs:
    build:
        name: build (${{ matrix.subdir }}, ${{ matrix.distro }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    # windows-2022 carries VS 2022 → conda-forge's vs2022 activation finds the v143
                    # toolset without the Build-Tools detour of docs/typed-windows.md W2.
                    # `pixi build` builds for the workspace's default environment = the `jazzy` feature
                    # (pixi.toml); mutex + python here are what the inspect step checks the result against.
                    - { os: windows-2022, subdir: win-64, distro: jazzy, mutex: '0.19', python: '3.12' }
                    - { os: macos-14, subdir: osx-arm64, distro: jazzy, mutex: '0.19', python: '3.12' }
                    - { os: ubuntu-24.04, subdir: linux-64, distro: jazzy, mutex: '0.19', python: '3.12' }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: prefix-dev/setup-pixi@v0.10.2
              with:
                  pixi-version: ${{ env.PIXI_VERSION }}
                  run-install: false
            # MAX_PATH: the runner's checkout plus the ~211 chars the rosidl build adds crosses 260.
            # detached-environments moves .pixi (build workspace included) to a 4-char root.
            - name: Windows build root
              if: runner.os == 'Windows'
              run: pixi config set --local detached-environments 'C:\px'
            - name: pixi build rig_interfaces + rig_nodes
              run: |
                  rm -rf dist
                  pixi build --path src/rig_interfaces/pixi.toml --output-dir dist
                  pixi build --path src/rig_nodes/pixi.toml --output-dir dist
                  ls -la dist
            # Each archive must be a well-formed .conda; its subdir comes from its own metadata
            # (rig_nodes may come out noarch), and its RoboStack pins must be THE pinned set.
            - name: inspect the packages (pins)
              run: |
                  pixi exec --spec python --spec zstandard -- python - dist "${{ matrix.subdir }}" "${{ matrix.mutex }}" "${{ matrix.python }}" <<'EOF'
                  import glob, io, json, os, shutil, sys, tarfile, zipfile
                  import zstandard
                  dist, subdir, mutex, pyver = sys.argv[1:5]
                  ok = True
                  for path in sorted(glob.glob(os.path.join(dist, "*.conda"))):
                      with zipfile.ZipFile(path) as z:  # closed before the move below (Windows: WinError 32 otherwise)
                          names = z.namelist()  # a .conda = zip{pkg-*.tar.zst, info-*.tar.zst, metadata.json}
                          assert any(n.startswith("pkg-") for n in names) and any(n.startswith("info-") for n in names), names
                          info = next(n for n in names if n.startswith("info-"))
                          raw = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(info))).read()
                          pkg = next(n for n in names if n.startswith("pkg-"))
                          payload = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(pkg))).read()
                      with tarfile.open(fileobj=io.BytesIO(raw)) as t:
                          index = json.load(t.extractfile("info/index.json"))
                      files = tarfile.open(fileobj=io.BytesIO(payload)).getnames()
                      if index["name"] == "rig_nodes":
                          # the real package, not an editable stub: every module + the Zenoh configs inside
                          need = ["rig_nodes/__init__.py", "rig_nodes/_common.py", "rig_nodes/supervise.py", "rig_nodes/zenoh.py", "rig_nodes/runtime.py",
                                  "rig_nodes/config/zenoh-router.json5", "rig_nodes/config/zenoh-session.json5", "rig_nodes/sims/fictrac_sim.py", "rig_nodes/bias_health.py", "rig_nodes/host_monitor.py", "rig_nodes/host_sampler.py"]
                          missing = [n for n in need if not any(f.endswith(n) for f in files)]
                          if missing:
                              print(f"  !! rig_nodes package is missing {missing} ({len(files)} files)"); ok = False
                      depends = index.get("depends", [])
                      pkg_subdir = index.get("subdir")
                      mx = [d for d in depends if d.startswith("ros2-distro-mutex")]
                      py = [d for d in depends if d.split()[0] == "python"]
                      print(os.path.basename(path), pkg_subdir, index["version"], mx, py)
                      if index["version"] != os.environ["PACKAGE_SET_VERSION"]:
                          print(f"  !! version {index['version']} != package set {os.environ['PACKAGE_SET_VERSION']}"); ok = False
                      # rig_interfaces is compiled against ONE RoboStack set: pixi-build-ros adds a bare `ros2-distro-mutex`
                      # and the mutex's run_exports add the pin, `>=0.19.0,<0.20.0a0`. rig_nodes is noarch Python and
                      # set-agnostic since 2026-11-05: pixi-build-python carries no run_exports, so it names the mutex
                      # bare and takes the set from the consumer's pin through its distro-neutral `ros2-*` dependencies
                      # (docs/ros-distro-switch.md) — those must be there.
                      if index["name"] == "rig_nodes":
                          need_deps = ["ros2-distro-mutex", "ros2-rclpy", "ros2-rosbag2-py", "ros2-rosbag2-storage-mcap"]
                          missing = [n for n in need_deps if not any(d.split()[0] == n for d in depends)]
                          if missing:
                              print(f"  !! rig_nodes run dependencies lack {missing}"); ok = False
                      else:
                          pinned = [m for m in mx if f">={mutex}" in m or f"{mutex}.*" in m]
                          if not pinned:
                              print(f"  !! ros2-distro-mutex pin {mx} is not {mutex}"); ok = False
                      if pkg_subdir not in (subdir, "noarch"):
                          print(f"  !! subdir {pkg_subdir} is neither {subdir} nor noarch"); ok = False
                      # rig_nodes (noarch) pins python >=3.12; rig_interfaces carries no python entry of its own
                      # (its extension lives under lib/python3.X/site-packages — the host python decides that path).
                      if py and not any(pyver in p for p in py) and not any(p.startswith("python >=") for p in py):
                          print(f"  !! python pin {py} is not {pyver}"); ok = False
                      if index["name"] == "rig_interfaces" and f"py{pyver.replace('.', '')}" not in index.get("build", ""):
                          print(f"  !! rig_interfaces build string {index.get('build')} was not made against Python {pyver}"); ok = False
                      out = os.path.join(dist, pkg_subdir)
                      os.makedirs(out, exist_ok=True)
                      shutil.move(path, os.path.join(out, os.path.basename(path)))
                  sys.exit(0 if ok else 1)
                  EOF
                  find dist -type f | sort
            - uses: actions/upload-artifact@v5
              with:
                  name: packages-${{ matrix.subdir }}
                  path: dist/**/*.conda
                  if-no-files-found: error
                  retention-days: 30

    channel:
        name: channel (index + artifact)
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: prefix-dev/setup-pixi@v0.10.2
              with:
                  pixi-version: ${{ env.PIXI_VERSION }}
                  run-install: false
            # One artifact per build platform → channel/<pkg subdir>/<pkg>.conda (the subdir
            # directories were created by the inspect step from each package's own metadata).
            - uses: actions/download-artifact@v5
              with:
                  pattern: packages-*
                  path: artifacts
            - name: assemble + index the channel
              run: |
                  mkdir -p channel
                  for d in artifacts/packages-*; do
                      cp -r "$d"/. channel/
                  done
                  pixi exec rattler-index fs channel
                  find channel -type f | sort
                  python3 - <<'EOF'
                  import json, pathlib
                  for rd in sorted(pathlib.Path("channel").glob("*/repodata.json")):
                      pk = json.load(open(rd))["packages.conda"]
                      for name, rec in pk.items():
                          print(rd.parent.name, name, rec["sha256"], [d for d in rec["depends"] if d.startswith(("ros2-distro-mutex", "python"))])
                  EOF
            - uses: actions/upload-artifact@v5
              with:
                  name: rig-nodes-channel
                  path: channel
                  if-no-files-found: error
                  retention-days: 90
            - name: upload to the hosted channel
              if: startsWith(github.ref, 'refs/tags/v') && vars.RIG_NODES_CHANNEL != ''
              env:
                  PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
                  RIG_NODES_CHANNEL: ${{ vars.RIG_NODES_CHANNEL }}
              run: pixi exec rattler-build upload prefix --channel "$RIG_NODES_CHANNEL" channel/*/*.conda

    accept:
        # The release gate: a clean directory with ONLY a consumer manifest, the channel just built
        # and RoboStack; `pixi install` must resolve both packages, and the repository's tests must
        # pass against the INSTALLED packages (the tests are copied in; the source tree is not).
        name: accept (${{ matrix.subdir }}, ${{ matrix.distro }})
        needs: channel
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: windows-2022, subdir: win-64, distro: jazzy, mutex: '0.19', python: '3.12' }
                    - { os: macos-14, subdir: osx-arm64, distro: jazzy, mutex: '0.19', python: '3.12' }
                    - { os: ubuntu-24.04, subdir: linux-64, distro: jazzy, mutex: '0.19', python: '3.12' }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  path: src-tree
            - uses: prefix-dev/setup-pixi@v0.10.2
              with:
                  pixi-version: ${{ env.PIXI_VERSION }}
                  run-install: false
            - uses: actions/download-artifact@v5
              with:
                  name: rig-nodes-channel
                  path: channel
            - name: consumer manifest in a clean directory
              run: |
                  mkdir -p accept/tests
                  cp src-tree/tests/*.py accept/tests/
                  CHAN="$(pwd)/channel"
                  case "$RUNNER_OS" in Windows) CHAN="$(cygpath -m "$CHAN")";; esac
                  cat > accept/pixi.toml <<EOF
                  [workspace]
                  name = "rig-nodes-accept"
                  channels = ["conda-forge", "robostack-${{ matrix.distro }}", "file://$CHAN"]
                  platforms = [${{ matrix.subdir == 'osx-arm64' && '{ name = "osx-arm64-macos-14-0", platform = "osx-arm64", macos = "14.0" }' || format('"{0}"', matrix.subdir) }}]

                  [activation.env]
                  RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
                  ZENOH_ROUTER_CHECK_ATTEMPTS = "0"
                  PYTHONUTF8 = "1"

                  [dependencies]
                  ros2-distro-mutex = "${{ matrix.mutex }}.*"
                  python = "${{ matrix.python }}.*"
                  ros-${{ matrix.distro }}-ros-base = "*"
                  ros-${{ matrix.distro }}-rmw-zenoh-cpp = "*"
                  rig_nodes = "==${{ env.PACKAGE_SET_VERSION }}"
                  rig_interfaces = "==${{ env.PACKAGE_SET_VERSION }}"
                  EOF
                  cat accept/pixi.toml
            - name: pixi install from the channel
              working-directory: accept
              run: |
                  pixi install
                  pixi list | grep -E "^(rig_|ros2-distro-mutex|python |ros2-rclpy|ros2-rmw-zenoh-cpp)" || pixi list | grep -iE "rig_|mutex|^python"
                  pixi run python -m rig_nodes.runtime
            - name: typed interfaces import + serialize (installed package)
              working-directory: accept
              run: pixi run python -m rig_nodes.build_interfaces --check
            - name: pure tests against the installed package
              working-directory: accept
              run: pixi run python tests/test_pure.py
            - name: host sampler (no ROS, fake psutil) against the installed package + the installed .msg files
              working-directory: accept
              run: pixi run python tests/test_host_sampler.py
            - name: device-node conformance against the installed package
              working-directory: accept
              run: pixi run python tests/test_device_nodes.py --timeout-scale 2

    lyrical:
        # The migration rehearsal (docs/ros-distro-switch.md): the SAME source tree built and tested on
        # RoboStack Lyrical (ROS 2 Lyrical Luth; mutex 0.22, Python 3.14, rmw_zenoh ≥ 0.10.6) through
        # the workspace's `lyrical` environment — pixi-build compiles rig_interfaces and packages
        # rig_nodes for that set in place, then the pure, host-sampler, FicTrac-simulator and
        # device-node conformance tests (simulators only, no hardware) run on it. Allowed to fail:
        # nothing a rig runs depends on it, and RoboStack's Lyrical channel is young. No channel
        # payload comes out of it — the published package set stays Jazzy until a migration is decided.
        name: lyrical rehearsal (${{ matrix.subdir }}, allowed to fail)
        continue-on-error: true
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: windows-2022, subdir: win-64 }
                    - { os: macos-14, subdir: osx-arm64 }
                    - { os: ubuntu-24.04, subdir: linux-64 }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: prefix-dev/setup-pixi@v0.10.2
              with:
                  pixi-version: ${{ env.PIXI_VERSION }}
                  run-install: false
            - name: Windows build root
              if: runner.os == 'Windows'
              run: pixi config set --local detached-environments 'C:\px'
            - name: pixi install -e lyrical (builds both packages for the Lyrical set)
              run: |
                  pixi install -e lyrical
                  pixi list -e lyrical | grep -E "^(rig_|ros2-distro-mutex|python |ros2-rclpy|ros2-rmw-zenoh-cpp|ros2-rosbag2-storage-mcap)"
                  pixi run -e lyrical runtime
            - name: typed interfaces import + serialize
              run: pixi run -e lyrical python -m rig_nodes.build_interfaces --check
            - name: pure tests
              run: pixi run -e lyrical test-pure
            - name: host sampler
              run: pixi run -e lyrical test-host
            - name: FicTrac simulator
              run: pixi run -e lyrical test-sim
            - name: device-node conformance (simulators → nodes → topics → recorder)
              run: pixi run -e lyrical test -- --timeout-scale 2
